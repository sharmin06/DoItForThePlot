<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoItForThePlot - Access</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet" />
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        "primary": "#13a4ec",
                        "background-dark": "#101c22",
                        "surface-dark": "#192b33",
                        "surface-hover": "#233c48",
                        "text-secondary": "#92b7c9",
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #101c22;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center p-6 bg-background-dark text-white bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-dark via-background-dark to-background-dark">

    <div
        class="w-full max-w-md bg-surface-dark rounded-3xl p-8 shadow-2xl border border-white/5 relative overflow-hidden">

        <!-- Background Decor -->
        <div class="absolute top-0 right-0 -mt-8 -mr-8 w-32 h-32 bg-primary/20 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 left-0 -mb-8 -ml-8 w-32 h-32 bg-purple-500/20 rounded-full blur-3xl"></div>

        <div class="relative z-10 flex flex-col items-center text-center">

            <img src="logo.png" alt="DoItForThePlot Logo" class="h-20 mb-6 drop-shadow-xl object-contain">

            <h1 class="text-3xl font-extrabold mb-2">Welcome Back</h1>
            <p class="text-text-secondary text-sm mb-8">Access your personalized event experience</p>

            <!-- Role Toggles -->
            <div class="grid grid-cols-2 gap-2 p-1 bg-surface-hover rounded-xl w-full mb-8">
                <button onclick="setRole('user')" id="btn-user"
                    class="py-2.5 rounded-lg text-sm font-semibold transition-all bg-primary text-white shadow-lg">
                    Attendee
                </button>
                <button onclick="setRole('organizer')" id="btn-org"
                    class="py-2.5 rounded-lg text-sm font-semibold text-text-secondary hover:text-white transition-all">
                    Organizer
                </button>
            </div>

            <!-- Login/Signup Form -->
            <form id="authForm" class="w-full space-y-4" onsubmit="handleSubmit(event)">
                <div id="signupFields" class="hidden space-y-4">
                    <div class="space-y-1 text-left">
                        <label class="text-xs font-semibold text-text-secondary ml-1">Full Name</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-3 text-text-secondary">person</span>
                            <input type="text" id="name"
                                class="w-full bg-surface-hover border border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-white focus:outline-none focus:border-primary transition-colors text-sm"
                                placeholder="Alex Johnson">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1 text-left">
                            <label class="text-xs font-semibold text-text-secondary ml-1">Age</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-3 text-text-secondary">calendar_today</span>
                                <input type="number" id="age" min="13" max="120"
                                    class="w-full bg-surface-hover border border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-white focus:outline-none focus:border-primary transition-colors text-sm"
                                    placeholder="25">
                            </div>
                        </div>
                        <div class="space-y-1 text-left">
                            <label class="text-xs font-semibold text-text-secondary ml-1">Gender</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-3 text-text-secondary">wc</span>
                                <select id="gender"
                                    class="w-full bg-surface-hover border border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-white focus:outline-none focus:border-primary transition-colors text-sm appearance-none cursor-pointer">
                                    <option value="" disabled selected>Select</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-1 text-left">
                    <label class="text-xs font-semibold text-text-secondary ml-1">Email Address</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-3 text-text-secondary">mail</span>
                        <input type="email" id="email" value="alex@host.com"
                            class="w-full bg-surface-hover border border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-white focus:outline-none focus:border-primary transition-colors text-sm"
                            placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="space-y-1 text-left">
                    <label class="text-xs font-semibold text-text-secondary ml-1">Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-3 text-text-secondary">lock</span>
                        <input type="password" id="password" value="password"
                            class="w-full bg-surface-hover border border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-white focus:outline-none focus:border-primary transition-colors text-sm"
                            placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full py-3 bg-primary hover:bg-primary/90 text-white font-bold rounded-xl mt-4 shadow-lg shadow-primary/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                    <span>Login</span>
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
                </button>
            </form>

            <p class="mt-6 text-xs text-text-secondary" id="toggleText">
                Don't have an account? <a href="#" onclick="toggleAuthMode(event)" class="text-primary hover:underline">Create one</a>
            </p>

        </div>
    </div>

    <!-- Logic Script -->
    <script src="js/db.js"></script>
    <script>
        let currentRole = 'user';

        function setRole(role) {
            currentRole = role;

            // UI Updates
            const btnUser = document.getElementById('btn-user');
            const btnOrg = document.getElementById('btn-org');
            const emailInput = document.getElementById('email');

            if (role === 'user') {
                btnUser.className = "py-2.5 rounded-lg text-sm font-semibold transition-all bg-primary text-white shadow-lg";
                btnOrg.className = "py-2.5 rounded-lg text-sm font-semibold text-text-secondary hover:text-white transition-all";
                emailInput.value = "alex@host.com"; // User demo credential
            } else {
                btnOrg.className = "py-2.5 rounded-lg text-sm font-semibold transition-all bg-primary text-white shadow-lg";
                btnUser.className = "py-2.5 rounded-lg text-sm font-semibold text-text-secondary hover:text-white transition-all";
                emailInput.value = "sarah@org.com"; // Org demo credential
            }
        }

        let isSignup = false;

        function toggleAuthMode(e) {
            e.preventDefault();
            isSignup = !isSignup;
            
            const signupFields = document.getElementById('signupFields');
            const submitBtnText = document.querySelector('#submitBtn span');
            const toggleText = document.getElementById('toggleText');
            
            if (isSignup) {
                signupFields.classList.remove('hidden');
                submitBtnText.textContent = 'Create Account';
                toggleText.innerHTML = `Already have an account? <a href="#" onclick="toggleAuthMode(event)" class="text-primary hover:underline">Log in</a>`;
                document.getElementById('name').setAttribute('required', 'true');
                document.getElementById('age').setAttribute('required', 'true');
                document.getElementById('gender').setAttribute('required', 'true');
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            } else {
                signupFields.classList.add('hidden');
                submitBtnText.textContent = 'Login';
                toggleText.innerHTML = `Don't have an account? <a href="#" onclick="toggleAuthMode(event)" class="text-primary hover:underline">Create one</a>`;
                document.getElementById('name').removeAttribute('required');
                document.getElementById('age').removeAttribute('required');
                document.getElementById('gender').removeAttribute('required');
                setRole(currentRole); // Reset default credentials
            }
        }

        function handleSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;

            if (isSignup) {
                const name = document.getElementById('name').value;
                const age = document.getElementById('age').value;
                const gender = document.getElementById('gender').value;

                const user = DB.signup({ email, name, age, gender, role: currentRole });
                if (user) {
                    redirectUser();
                } else {
                    alert('Email already in use!');
                }
            } else {
                const user = DB.login(email, currentRole);
                if (user) {
                    redirectUser();
                } else {
                    alert('Invalid credentials! Try alex@host.com (User) or sarah@org.com (Organizer)');
                }
            }
        }

        function redirectUser() {
            if (currentRole === 'user') {
                window.location.href = '/stitch_organizer_dashboard_overview/user_discover_events/code.html';
            } else {
                window.location.href = '/stitch_organizer_dashboard_overview/organizer_dashboard_overview/code.html';
            }
        }
    </script>
</body>

</html>
