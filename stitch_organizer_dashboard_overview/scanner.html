<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { "primary": "#13a4ec", "background-dark": "#101c22", "surface-dark": "#192b33" } }
            }
        }
    </script>
    <style>
        body {
            background-color: #101c22;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen p-6 text-white">

    <div class="w-full max-w-md bg-surface-dark rounded-3xl p-6 shadow-2xl border border-white/5 text-center">
        <h1 class="text-2xl font-bold mb-2">Ticket Scanner</h1>
        <p class="text-gray-400 text-sm mb-8">Enter Ticket ID to check-in attendee</p>

        <div class="relative mb-6">
            <span class="material-symbols-outlined absolute left-4 top-3.5 text-gray-400">qr_code_scanner</span>
            <input type="text" id="ticketId"
                class="w-full bg-black/20 border border-white/10 rounded-xl py-3 pl-12 pr-4 text-white focus:border-primary focus:ring-0 text-lg font-mono tracking-widest uppercase placeholder:normal-case placeholder:tracking-normal placeholder:text-gray-600"
                placeholder="e.g. SMS-1234-AB">
        </div>

        <button onclick="handleScan()"
            class="w-full py-4 bg-primary hover:bg-primary/90 text-white font-bold rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
            Verify & Check-In
        </button>

        <div id="result" class="mt-6 hidden p-4 rounded-xl"></div>

        <button onclick="window.location.href='organizer_dashboard_overview/code.html'"
            class="mt-6 text-gray-500 hover:text-white text-sm">
            Back to Dashboard
        </button>
    </div>

    <script src="../../js/db.js"></script>
    <script>
        // Auth Check
        const currentUser = DB.getCurrentUser();
        if (!currentUser || currentUser.role !== 'organizer') {
            window.location.href = '../../auth.html';
        }

        function handleScan() {
            const ticketId = document.getElementById('ticketId').value.trim();
            const resultDiv = document.getElementById('result');

            if (!ticketId) return;

            const regs = JSON.parse(localStorage.getItem(DB.KEYS.REGISTRATIONS));
            const regIndex = regs.findIndex(r => r.id.toLowerCase() === ticketId.toLowerCase());

            if (regIndex === -1) {
                // Invalid
                resultDiv.className = "mt-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400";
                resultDiv.innerHTML = `
                    <div class="flex flex-col items-center gap-2">
                        <span class="material-symbols-outlined text-4xl">error</span>
                        <span class="font-bold text-lg">Invalid Ticket</span>
                        <span class="text-sm opacity-80">ID not found in system</span>
                    </div>
                `;
            } else {
                const reg = regs[regIndex];
                if (reg.status === 'checked-in') {
                    // Already Checked In
                    resultDiv.className = "mt-6 p-4 rounded-xl bg-yellow-500/10 border border-yellow-500/20 text-yellow-400";
                    resultDiv.innerHTML = `
                        <div class="flex flex-col items-center gap-2">
                            <span class="material-symbols-outlined text-4xl">history</span>
                            <span class="font-bold text-lg">Already Used</span>
                            <span class="text-sm opacity-80">Checked in at ${new Date(reg.checkInTime).toLocaleTimeString()}</span>
                        </div>
                    `;
                } else {
                    // Success
                    reg.status = 'checked-in';
                    reg.checkInTime = new Date().toISOString();
                    regs[regIndex] = reg;
                    localStorage.setItem(DB.KEYS.REGISTRATIONS, JSON.stringify(regs));

                    // Update event stats
                    const events = JSON.parse(localStorage.getItem(DB.KEYS.EVENTS));
                    const event = events.find(e => e.id === reg.event_id);
                    if (event) {
                        event.checked_in = (event.checked_in || 0) + 1;
                        localStorage.setItem(DB.KEYS.EVENTS, JSON.stringify(events));
                    }

                    resultDiv.className = "mt-6 p-4 rounded-xl bg-green-500/10 border border-green-500/20 text-green-400";
                    resultDiv.innerHTML = `
                        <div class="flex flex-col items-center gap-2">
                            <span class="material-symbols-outlined text-4xl">check_circle</span>
                            <span class="font-bold text-lg">Check-In Successful</span>
                            <span class="text-sm opacity-80">Welcome!</span>
                        </div>
                    `;
                }
            }
            resultDiv.classList.remove('hidden');
        }
    </script>
</body>

</html>
