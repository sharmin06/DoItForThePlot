<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Feedback</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { "primary": "#13a4ec", "background-dark": "#101c22", "surface-dark": "#192b33" } }
            }
        }
    </script>
    <style>
        body {
            background-color: #101c22;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen p-6 text-white bg-background-dark">

    <div class="w-full max-w-md">
        <div class="flex items-center mb-8">
            <button onclick="window.history.back()" class="mr-4 p-2 hover:bg-white/10 rounded-full"><span
                    class="material-symbols-outlined">arrow_back</span></button>
            <h1 class="text-2xl font-bold">Feedback</h1>
        </div>

        <div id="feedbackFormContainer" class="bg-surface-dark rounded-3xl p-6 shadow-2xl border border-white/5">
            <h2 class="text-lg font-bold mb-1">Rate your experience</h2>
            <p class="text-gray-400 text-sm mb-6">Neon Nights Festival</p>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2">Overall Rating</label>
                    <div class="flex gap-2">
                        <button onclick="setRating(1)"
                            class="star-btn p-2 hover:bg-white/5 rounded-lg text-gray-600"><span
                                class="material-symbols-outlined text-3xl">star</span></button>
                        <button onclick="setRating(2)"
                            class="star-btn p-2 hover:bg-white/5 rounded-lg text-gray-600"><span
                                class="material-symbols-outlined text-3xl">star</span></button>
                        <button onclick="setRating(3)"
                            class="star-btn p-2 hover:bg-white/5 rounded-lg text-gray-600"><span
                                class="material-symbols-outlined text-3xl">star</span></button>
                        <button onclick="setRating(4)"
                            class="star-btn p-2 hover:bg-white/5 rounded-lg text-gray-600"><span
                                class="material-symbols-outlined text-3xl">star</span></button>
                        <button onclick="setRating(5)"
                            class="star-btn p-2 hover:bg-white/5 rounded-lg text-gray-600"><span
                                class="material-symbols-outlined text-3xl">star</span></button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Comments</label>
                    <textarea
                        class="w-full bg-black/20 border border-white/10 rounded-xl p-3 text-white focus:border-primary focus:ring-0 rows-3"
                        placeholder="Tell us what you liked..."></textarea>
                </div>

                <button onclick="submitFeedback()"
                    class="w-full py-4 bg-primary hover:bg-primary/90 text-white font-bold rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
                    Submit Feedback
                </button>
            </div>
        </div>
    </div>

    <script>
        let rating = 0;
        function setRating(r) {
            rating = r;
            const stars = document.querySelectorAll('.star-btn span');
            stars.forEach((s, i) => {
                s.style.fontVariationSettings = `'FILL' ${i < r ? 1 : 0}`;
                s.parentElement.classList.toggle('text-yellow-400', i < r);
                s.parentElement.classList.toggle('text-gray-600', i >= r);
            });
        }

        function submitFeedback() {
            if (rating === 0) {
                alert('Please select a rating');
                return;
            }
            alert('Thank you! Your feedback helps us improve.');
            window.location.href = '../stitch_organizer_dashboard_overview/user_discover_events/code.html';
        }
    </script>
</body>

</html>
